<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
    }
    .profile-pic {
      max-width: 300px;
      width: 100%;
      height: auto;
      border-radius: 0.375rem;
      box-shadow: 0 .125rem .25rem rgba(0,0,0,.075); 
      margin-bottom: 1rem;
    }
    .page-footer {
      background-color: #212529;
      color: white;
      text-align: center;
      padding: 1rem 0;
      margin-top: 2rem;
    }
    .contact-blurb {
      max-width: 600px;
      margin-bottom: 2rem;
      color: #333;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light px-4">
  <a class="navbar-brand" href="#">MyPortfolio</a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
      <ul class="navbar-nav">
       <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
      <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfolio</a></li>
      <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
    </ul>
 
  </div>
</nav>

<div class="container mt-5">
  <div class="row align-items-center">
   
    <div class="col-md-6">
      <p class="contact-blurb">
        Feel free to get in touch with me. I'm open to discussing new projects, creative ideas, or opportunities to be part of your visions.
      </p>
      <img src="images/telephone.jpg" alt="Contact" class="profile-pic" />
    </div>

    <div class="col-md-6">
      <h2 class="mb-4">Let's Connect</h2>
      <form>
        <div class="row mb-3">
          <div class="col">
            <label for="firstName" class="form-label">First Name</label>
            <input type="text" id="firstName" class="form-control" placeholder="First name" required />
          </div>
          <div class="col">
            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" id="lastName" class="form-control" placeholder="Last name" required />
          </div>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required />
        </div>
        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea id="message" class="form-control" rows="4" placeholder="Write your message here..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </div>
  </div>
</div>

<footer class="page-footer">
  <p>&copy; 2025 Jillian Sleiman. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
